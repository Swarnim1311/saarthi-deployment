# SAARTHI Spring Boot Application Properties
# PORT is provided by the hosting platform (e.g. Vercel); default 5000 keeps
# local development behavior unchanged.
server.port=${PORT:5000}
spring.application.name=saarthi-backend

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/,file:./static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Database Configuration (In-Memory H2 for local dev/testing; switch to PostgreSQL when running DB)
spring.datasource.url=jdbc:h2:mem:saarthidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Logging
logging.level.com.saarthi=INFO
logging.level.org.springframework.web=INFO

# P0 freshness / path robustness (optional, commented out = packaged classpath copies).
# Point at a refreshed NB06 package to serve it without rebuilding the jar, then call
# POST /api/forecast/reload (forecast) or POST /api/climate-context/reload (climate).
# Example: -Dsaarthi.forecast.path=C:/data/saarthi/application -Dsaarthi.climate.path=C:/data/saarthi/climate_context
# saarthi.forecast.path=
# saarthi.climate.path=

# Live weather (Open-Meteo delivery + ECMWF IFS NWP). No API key or secret:
# the prototype endpoint is keyless. Never commit secrets here.
# saarthi.weather.base-url defaults to https://api.open-meteo.com
# saarthi.weather.base-url=
# saarthi.weather.timeout-seconds=25
# saarthi.weather.cache-ttl-minutes=60
# Optional: point at the local CHIRPS block CSV to enable observed_last_*_mm
# (recent observed rainfall, kept strictly separate from forecast fields).
# Example: -Dsaarthi.chirps.path=C:/data/saarthi/Sangrur_Block_Daily_Rainfall_2010_2025.csv
# saarthi.chirps.path=

# Live IFS shadow validation (Phase 4.x data-collection layer, additive).
# One immutable JSONL record per (issue, block) is appended on every fresh
# live forecast; truth (CHIRPS D+1..D+7) is attached later by
# `python -m src.shadow.truth`. Capture is fail-soft: storage failure never
# breaks /api/weather/*. Blank = repo-canonical
# <repo>/data/processed/shadow/ifs_shadow.jsonl (resolved from the module dir).
# saarthi.shadow.path=

# FIELD_HIGH live shadow (Phase 4.3 data-collection layer, additive, separate
# ledger). Truth (CHIRPS D+1..D+3 wet count >= 2) is attached later by
# `python -m src.shadow.field_shadow`. Blank = repo-canonical
# <repo>/data/processed/shadow/field_shadow.jsonl. Dry-spell ledger untouched.
# saarthi.fieldshadow.path=
# Bhashini voice (ULCA ASR + Indic TTS for the /api/voice endpoints).
# Credentials ONLY via environment variables; placeholders live here and in
# the root .env.example. Never commit real values. Unconfigured = fail-soft:
# the endpoints report available:false and the browser speech fallback is used.
# BHASHINI_USER_ID / BHASHINI_API_KEY resolve from the environment first.
# saarthi.bhashini.user-id=
# saarthi.bhashini.api-key=
# saarthi.bhashini.pipeline-id defaults to the shared MeitY pipeline.
# saarthi.bhashini.pipeline-id=64392f96daac500b55c543cd
# saarthi.bhashini.pipeline-url defaults to the ULCA getModelsPipeline endpoint.
# saarthi.bhashini.timeout-seconds=15
# saarthi.bhashini.cache-ttl-minutes=60

# Government policy monitor (official PIB RSS; disabled ingestion by default).
# Ingestion stays disabled unless explicitly enabled with a token:
# -Dsaarthi.policy.ingestion-enabled=true -Dsaarthi.policy.admin-token=<token>
# saarthi.policy.pib-rss-url defaults to the official PIB agriculture feed.
# saarthi.policy.fetch-timeout-seconds defaults to 15.
# saarthi.policy.ingestion-enabled=false
# saarthi.policy.admin-token=

# Official mandi prices (CropAtlas). Source: the data.gov.in Agmarknet
# daily-price record set (Ministry of Agriculture & Farmers Welfare). The API is
# KEYED: with no key configured, /api/market/price answers available:false with
# reason not_configured and the card shows "No recent verified market price
# available for this crop." A price is never invented, and a record older than
# the freshness window is still shown with its real date, labelled as old.
# Supply the key through the DATA_GOV_IN_API_KEY environment variable; never
# commit it. Generate/store nothing else: there is no price cache on disk.
# saarthi.market.api-key=
# saarthi.market.resource-id defaults to the Agmarknet daily-price record set.
# saarthi.market.resource-id=
# saarthi.market.timeout-seconds=20

# Sign-in (/signin). DISABLED by default, and no credential is bundled in the
# repository: the page reports "not configured" until the settings below exist.
# Passwords are supplied only as PBKDF2-SHA256 hashes
# (format pbkdf2-sha256$<iterations>$<saltBase64>$<hashBase64>); generate one
# locally with com.saarthi.auth.PasswordHashTool, which reads the password from
# the console. Environment equivalents: SAARTHI_AUTH_ENABLED,
# SAARTHI_AUTH_FARMER_USERNAME, SAARTHI_AUTH_FARMER_PASSWORD_HASH,
# SAARTHI_AUTH_OFFICIAL_USERNAME, SAARTHI_AUTH_OFFICIAL_PASSWORD_HASH.
# saarthi.auth.enabled=false
# saarthi.auth.farmer.username=
# saarthi.auth.farmer.password-hash=
# saarthi.auth.official.username=
# saarthi.auth.official.password-hash=
# saarthi.auth.session-ttl-minutes=480

