# Test profile: ephemeral in-memory H2. Production uses PostgreSQL
# (see src/main/resources/application.properties). Flyway is disabled here;
# Hibernate generates the schema from the entities (create-drop).
spring.datasource.url=jdbc:h2:mem:saarthidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.flyway.enabled=false

# JWT configuration for tests
saarthi.jwt.secret=test-secret-key-for-saarthi-jwt-authentication-2026
saarthi.jwt.expiration-ms=86400000
